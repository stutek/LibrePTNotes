# OWASP ZAP baseline scan rules for LibrePTNotes (run by build.run_owasp_zap_scan, Stage 5).
#
# Policy: every ZAP alert is either FIXED at its source (security headers served by
# deploy/local_http_server.py, the <meta> CSP in src/index.html) or IGNOREd here with a written
# reason. Nothing is left to merely WARN: a warning fails the build. Only alerts that genuinely do
# not apply to an offline-first, buildless, static PWA with no backend are ignored below.
# Format: <pluginId><TAB><IGNORE|WARN|FAIL><TAB># reason
#
10027	IGNORE	# Information Disclosure - Suspicious Comments: passive heuristic matching ordinary words in the app's own open-source JS comments; nothing secret ships in them.
10049	IGNORE	# Non-Storable Content: cache storability of the local dev server's redirect and 404 responses; production caching is GitHub Pages' concern, and the service worker owns offline caching.
10109	IGNORE	# Modern Web Application: informational notice that this is a JavaScript app, not a vulnerability.
10202	IGNORE	# Absence of Anti-CSRF Tokens: there is no server and no state-changing request to forge; all data lives in the trainer's own IndexedDB and form-action is 'self' with no form posting anywhere. RE-CHECK if the app ever sends data to a server.
90004	IGNORE	# Cross-Origin-Embedder-Policy: cross-origin isolation (SharedArrayBuffer, high-resolution timers) is not used, so COEP buys nothing and GitHub Pages cannot send the header anyway.
